[package]
name = "githist"
version = "0.7.0"
authors = ["Josh Skeen <josh@joshskeen.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/joshskeen/githist-rs"
repository = "https://github.com/joshskeen/githist-rs"
description = "a text user interface for switching between recent branches"
readme = "README.md"
edition = "2021"
keywords = ["tui", "git", "cli"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ratatui = { version = "0.30.1", features = ["crossterm"] }
crossterm = "0.29.0"
git2 = "0.21.0"
chrono = "0.4.45"
timeago = "0.6.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
